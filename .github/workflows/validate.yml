name: Validate knowledge library

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate IDs and references
        run: python scripts/validate.py
      - name: Test interview and tutorial answer modes
        run: python scripts/test_validator_modes.py
      - name: Audit 12-hour Java course completeness
        run: python scripts/validate_mega.py
      - name: Audit six mock interviews, source integrity and repeated-question stars
        run: python scripts/validate_six.py
